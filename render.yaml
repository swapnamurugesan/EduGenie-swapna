services:
  - type: web
    name: edugenie
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EXPLANATION_PROVIDER
        value: gemini
      - key: REQUEST_TIMEOUT_SECONDS
        value: 30.0
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
